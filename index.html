<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- agregado a la pantalla de inicio, se abre sin la barra del navegador (iPhone y Android) -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="El Teniente">
<meta name="theme-color" content="#07060b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/iconos/icono180.png">
<link rel="icon" type="image/png" href="assets/iconos/icono192.png">
<title>El Teniente: Nato y la ciudad de las escaleras</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #07060b; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
               -webkit-touch-callout: none; overscroll-behavior: none; }
  @supports (height: 100dvh) { html, body { height: 100dvh; } }
  body { display: flex; align-items: center; justify-content: center; font-family: 'Trebuchet MS', sans-serif; }
  #pantalla { display: block; background: #000; box-shadow: 0 0 40px rgba(217,133,59,0.25); }
  /* Controles táctiles: se miden con el alto de pantalla que se ve (vh/vmin), así caben en cualquier teléfono,
     y se corren hacia adentro según la zona segura (notch, esquinas redondeadas y barra de inicio del iPhone). */
  #tactil { display: none; position: fixed; inset: 0; pointer-events: none;
    --b: clamp(40px, 17vmin, 74px); --c: calc(var(--b) * 0.72); --g: calc(var(--b) * 0.25);
    --sl: max(env(safe-area-inset-left, 0px), 4px); --sr: max(env(safe-area-inset-right, 0px), 4px);
    --st: env(safe-area-inset-top, 0px); --sb: max(env(safe-area-inset-bottom, 0px), 2px); }
  @supports (height: 100dvh) { #tactil { --b: clamp(40px, min(17dvh, 17dvw), 74px); } }   /* alto que se ve de verdad, sin las barras */
  body.es-tactil #tactil { display: block; }
  .bt { position: absolute; pointer-events: auto; width: var(--b); height: var(--b); border-radius: 50%; box-sizing: border-box;
        background: rgba(255,255,255,0.16); border: 2px solid rgba(255,255,255,0.45); color: #fff;
        font: bold calc(var(--b) * 0.34) 'Trebuchet MS', sans-serif; display: flex; align-items: center; justify-content: center;
        text-shadow: 0 1px 2px #000; -webkit-tap-highlight-color: transparent; }
  .bt.chico { width: var(--c); height: var(--c); font-size: calc(var(--c) * 0.34); }
  #izq { left: calc(var(--sl) + var(--g)); bottom: calc(var(--sb) + var(--g) * 1.2); }
  #der { left: calc(var(--sl) + var(--g) * 2 + var(--b)); bottom: calc(var(--sb) + var(--g) * 1.2); }
  #arr { left: calc(var(--sl) + var(--g) * 1.5 + var(--b) - var(--c) / 2); bottom: calc(var(--sb) + var(--g) * 1.8 + var(--b)); }
  #abajo2 { left: calc(var(--sl) + var(--g) * 2 + var(--b) * 1.62); bottom: calc(var(--sb) + var(--g) * 1.8 + var(--b)); }
  #aba { display: none; }
  #saltar { right: calc(var(--sr) + var(--g)); bottom: calc(var(--sb) + var(--g) * 1.4); background: rgba(90,180,90,0.30); }
  #golpe { right: calc(var(--sr) + var(--g) * 1.2 + var(--b)); bottom: calc(var(--sb) + var(--g) * 0.6); background: rgba(220,90,60,0.30); }
  #perro { right: calc(var(--sr) + var(--g) + var(--b) * 0.8); bottom: calc(var(--sb) + var(--g) * 1.8 + var(--b)); background: rgba(217,133,59,0.35); }
  #pausa { right: calc(var(--sr) + var(--g)); top: calc(var(--st) + var(--g) * 0.9); }
  #completa { right: calc(var(--sr) + var(--g) * 1.4 + var(--c)); top: calc(var(--st) + var(--g) * 0.9); display: none; }
  body.puede-completa:not(.en-completa) #completa { display: flex; }
  #girar { display: none; position: fixed; inset: 0; background: #07060b; color: #ffcf6a; font-size: 20px;
           align-items: center; justify-content: center; text-align: center; padding: 24px; }
  @media (orientation: portrait) and (pointer: coarse) { #girar { display: flex; } }
</style>
</head>
<body>
<canvas id="pantalla"></canvas>
<div id="tactil">
  <div class="bt" id="izq" data-accion="izq">◀</div>
  <div class="bt" id="der" data-accion="der">▶</div>
  <div class="bt chico" id="arr" data-accion="arriba">▲</div>
  <div class="bt chico" id="abajo2" data-accion="abajo">▼</div>
  <div class="bt" id="golpe" data-accion="golpe">B</div>
  <div class="bt" id="saltar" data-accion="saltar">A</div>
  <div class="bt chico" id="perro" data-accion="perro">🐕</div>
  <div class="bt chico" id="pausa" data-accion="pausa">❚❚</div>
  <div class="bt chico" id="completa">⛶</div>
</div>
<div id="girar">Gira el teléfono para jugar ↻</div>
<script src="js/voces.js"></script>
<script src="js/sonidos.js"></script>
<script src="js/logo.js"></script>
<script src="assets/sprites/manifiesto.js"></script>
<script src="assets/anim/anim.js"></script>
<script src="js/texto.js"></script>
<script src="js/audio.js"></script>
<script src="js/entrada.js"></script>
<script src="js/nivel1.js"></script>
<script src="js/nivel2.js"></script>
<script src="js/nivel3.js"></script>
<script src="js/nivel4.js"></script>
<script src="js/juego.js"></script>
</body>
</html>
